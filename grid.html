<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Grid from Static Database</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        h2 {
            margin-top: 20px;
            color: #333;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columns */
            gap: 15px;
            width: 80%;
            margin: 20px auto;
        }

        /* Images styling */
        .grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        /* Hover effect */
        .grid img:hover {
            transform: scale(1.05);
        }

        /* Responsive */
        @media screen and (max-width: 768px){
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media screen and (max-width: 480px){
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h2>Image Grid Layout</h2>

<!-- Grid Container -->
<div id="imageGrid" class="grid"></div>

<script>
    // Static Database of Images
    const images = [
        "https://picsum.photos/300/200?1",
        "https://picsum.photos/300/200?2",
        "https://picsum.photos/300/200?3",
        "https://picsum.photos/300/200?4",
        "https://picsum.photos/300/200?5",
        "https://picsum.photos/300/200?6",
        "https://picsum.photos/300/200?7",
        "https://picsum.photos/300/200?8",
        "https://picsum.photos/300/200?9",
        "https://picsum.photos/300/200?10",
        "https://picsum.photos/300/200?11",
        "https://picsum.photos/300/200?12"
    ];

    const grid = document.getElementById("imageGrid");

    // Loop through the static database and create image elements
    images.forEach(function(imgUrl){
        const img = document.createElement("img");
        img.src = imgUrl;
        grid.appendChild(img);
    });
</script>

</body>
</html>
